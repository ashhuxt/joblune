version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: joblune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: joblune
      POSTGRES_USER: joblune
      POSTGRES_PASSWORD: joblune
    ports:
      - "5432:5432"
    volumes:
      - joblune_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblune"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: joblune-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/joblune
      DB_USERNAME: joblune
      DB_PASSWORD: joblune
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-min-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  joblune_pg_data:
